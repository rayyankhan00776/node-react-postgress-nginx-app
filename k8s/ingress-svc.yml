apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskpro-ingress
  namespace: taskpro-ns
  annotations:
    # 1. Disable HTTPS redirection for seamless local development
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    
    # 2. Increase maximum body size to 10MB to allow user avatar file uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    
    # 3. Enable CORS support at the routing level (optional, backed up by your Express CORS)
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # Route all frontend views & React SPA routing to the frontend Nginx pod
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80

      # Route all backend REST API routes to the Node.js Express server
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5050